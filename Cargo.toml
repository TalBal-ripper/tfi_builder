[package]
name = "tfi_builder"
version = "0.1.0"
edition = "2024"

[dependencies]
egui = { version = "0.33.3", features = ["bytemuck", "cint", "color-hex", "default_fonts", "mint", "persistence", "serde", "ron"] }
eframe = { version = "0.33.3", features = ["glow"] }
rpgm-asset-decrypter-lib = "3.2.2"
walkdir = "2"
tempfile = "3"
regex = "1"
chrono = "0.4"
flate2 = "1"
tar = "0.4"
zip = { version = "2", features = ["deflate"] }
plist = "1"
serde_json = "1"
md-5 = "0.10"
reqwest = { version = "0.11", features = ["blocking"] }
